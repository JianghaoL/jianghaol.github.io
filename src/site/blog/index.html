<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Jianghao Li - Blog</title>

  <!-- Language redirect -->
  <script>
  (function(){
    var p = location.pathname;
    if (p.indexOf('/en/') === 0 || p.indexOf('/zh/') === 0) return;
    var lang = localStorage.getItem('preferred-lang') ||
      (navigator.language && navigator.language.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
    location.replace('/' + lang + p);
  })();
  </script>

  <!-- Main Styles -->
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <nav>
      <button class="lang-toggle" aria-label="Toggle Language">EN/中文</button>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../work-gallery/index.html">Work Gallery</a></li>
        <li><a href="index.html" class="active">Blog</a></li>
        <li><a href="../about.html">About</a></li>
      </ul>
      <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!-- Blog Hero Section -->
  <section id="blog-hero" class="blog-hero">
    <div class="blog-hero-content">
      <h1>Blog</h1>
      <p class="blog-subtitle">Geek musings, tech insights, and creative experiments</p>
    </div>
  </section>

  <!-- Blog Content Wrapper -->
  <div class="blog-content-wrapper">
    
    <!-- Table of Contents -->
    <aside class="blog-toc" id="blog-toc" aria-label="Table of Contents">
      <div class="toc-header">
        <svg class="toc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <h2>Quick Jump</h2>
      </div>
      <nav class="toc-links" id="toc-links">
        <!-- Generated by JavaScript -->
      </nav>
    </aside>

    <!-- Blog Grid -->
    <section class="blog-section">
      <div class="blog-grid" id="blog-grid">
        <!-- Cards will be rendered by JavaScript -->
      </div>
    </section>
    
  </div><!-- End blog-content-wrapper -->

  <!-- Footer -->
  {{> footer/footer-46e659299c}}

  <script src="../js/main.js"></script>
  <script src="blog.js"></script>
</body>
</html>
